<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RegiBERT 3D</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <header class="hud-header">
      <h1>RegiBERT 3D</h1>
      <div id="status-badge" class="badge connecting">
        <span class="dot"></span>
        <span id="status-text">Connexion...</span>
      </div>
    </header>

    <div id="card" class="card hidden">
      <div class="card-header">
        <span id="post-id" class="post-id">#000000</span>
        <span id="post-type" class="post-type">Live Stream</span>
      </div>
      <p id="post-text" class="post-text">Survolez un point ou attendez un nouveau post...</p>
      
      <div class="probs-container">
        <div class="prob-row">
          <span class="label">Soutenu</span>
          <div class="bar-bg"><div id="bar-soutenu" class="bar soutenu" style="width: 0%"></div></div>
          <span id="val-soutenu" class="val">0%</span>
        </div>
        <div class="prob-row">
          <span class="label">Courant</span>
          <div class="bar-bg"><div id="bar-courant" class="bar courant" style="width: 0%"></div></div>
          <span id="val-courant" class="val">0%</span>
        </div>
        <div class="prob-row">
          <span class="label">Familier</span>
          <div class="bar-bg"><div id="bar-familier" class="bar familier" style="width: 0%"></div></div>
          <span id="val-familier" class="val">0%</span>
        </div>
      </div>
    </div>

    <button id="info-tab" class="mobile-tab left-tab" title="Informations"><span class="material-icons">info_outline</span></button>
    <button id="card-tab" class="mobile-tab right-tab" title="Dernier Post"><span class="material-icons">chat</span></button>

    <div id="waiting-message" class="waiting-message">
      En attente du premier post dans <span id="countdown">5</span>...
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
